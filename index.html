<style>
/* Layout: left rail for navigation and one working column. On phones the rail becomes a scrolling top bar. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface2:#f5f8f7; --ink:#15232b; --muted:#566870; --line:#d5dddb;
  --accent:#27489b; --accent-ink:#ffffff; --accent-soft:#e3e9f7;
  --good:#1c7a45; --good-soft:#dff0e6; --warn:#8a5605; --warn-soft:#fbeed2; --bad:#b0261f; --bad-soft:#fae2e0;
  --shadow:0 1px 2px rgba(15,30,40,.07); --scrim:rgba(10,20,26,.45);
  --f-display:'Familjen Grotesk',system-ui,sans-serif; --f-body:'Public Sans',system-ui,sans-serif; --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#162127; --surface2:#1b2930; --ink:#e5edef; --muted:#93a4aa; --line:#27373e;
  --accent:#94acff; --accent-ink:#0d1630; --accent-soft:#1f2b4b;
  --good:#5fcf90; --good-soft:#16301f; --warn:#e5b25a; --warn-soft:#33270f; --bad:#ff8c83; --bad-soft:#3b1a18;
  --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#162127; --surface2:#1b2930; --ink:#e5edef; --muted:#93a4aa; --line:#27373e;
  --accent:#94acff; --accent-ink:#0d1630; --accent-soft:#1f2b4b;
  --good:#5fcf90; --good-soft:#16301f; --warn:#e5b25a; --warn-soft:#33270f; --bad:#ff8c83; --bad-soft:#3b1a18;
  --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:0}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15}
h2{font-size:17px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
body.ro .w{display:none!important}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:700;font-size:16px;min-width:0}
.brand span:last-child{line-height:1.15;overflow-wrap:anywhere}
.logo{flex:none;width:40px;height:40px;border-radius:8px;display:block;object-fit:cover}
.doc .top .logo{width:56px;height:56px;border-radius:10px}
.doc .top .who{display:flex;align-items:center;gap:14px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 10px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.rail nav button:hover{background:var(--surface2);color:var(--ink)}
.rail nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail nav button:focus-visible{outline:2px solid var(--accent)}
.railfoot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--muted)}

.main{padding:28px 32px 56px;min-width:0;max-width:1120px;width:100%}
.phead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.phead .sub{color:var(--muted);margin-top:4px}
.pact{display:flex;flex-wrap:wrap;gap:8px}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;font-weight:600;font-size:13px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card>.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card>.cbody{padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font-family:var(--f-num);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.bad .v{color:var(--bad)}
.tile .note{font-size:12px;color:var(--muted)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr[data-go]{cursor:pointer}
tbody tr[data-go]:hover td{background:var(--surface2)}
tfoot td{font-weight:600;background:var(--surface2)}
.lnk{color:var(--ink);font-weight:600;text-decoration:none}
.lnk:hover{color:var(--accent);text-decoration:underline}
td .sub2{display:block;font-size:12px;color:var(--muted)}

.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.paid{background:var(--good-soft);color:var(--good)}
.chip.partial{background:var(--accent-soft);color:var(--accent)}
.chip.unpaid{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.overdue{background:var(--bad-soft);color:var(--bad)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:16px}
.loading{padding:40px 20px;color:var(--muted)}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;margin-bottom:16px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner.err{background:var(--bad-soft);color:var(--bad)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}

.doc{padding:24px}
.doc .top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;margin-bottom:22px}
.doc .no{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.totals{margin-left:auto;width:min(100%,300px);display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin-top:14px}
.totals .grand{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:8px}

.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center}
.bartrack{height:10px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bartrack i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chartbox{overflow-x:auto}
svg.chart{display:block;width:100%;min-width:480px;height:auto}
svg.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .in{fill:var(--accent)}
svg.chart .out{fill:var(--warn)}

#drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
#drawer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:min(100%,520px);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel>header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.x{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--surface2);color:var(--ink)}
.pbody{padding:20px;overflow-y:auto;flex:1}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.fld .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact{display:flex;gap:8px;justify-content:flex-end;padding-top:6px;flex-wrap:wrap}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px 30px;gap:6px;align-items:center}
.item .x{text-align:center;padding:2px 0}
.itemhead{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px 30px;gap:6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ftotal{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--surface2);border-radius:6px;font-weight:600}
.err-t{color:var(--bad);font-size:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.toast[hidden]{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .rail nav{flex-direction:row;overflow-x:auto;min-width:0;flex:1}
  .railfoot{display:none}
  .brand{flex:none}
  .brand span:last-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .main{padding:20px 16px 48px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .g2{grid-template-columns:minmax(0,1fr)}
  .row2{grid-template-columns:minmax(0,1fr)}
  h1{font-size:22px}
  .doc{padding:16px}
  .barrow{grid-template-columns:90px 1fr auto}
}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var round2=function(n){return Math.round((+n+Number.EPSILON)*100)/100};
var BRAND={name:'Lenana Tech Hub',logo:document.querySelector('.brand .logo').getAttribute('src')};
var COLLS=['customers','invoices','payments','expenses'];
var CURRENCIES=['KES','USD','EUR','GBP','UGX','TZS','RWF','NGN','GHS','ZAR','INR','AED'];
var METHODS=['Cash','M-Pesa','Bank transfer','Card','Cheque','Other'];
var CATS=['Rent','Salaries','Supplies','Transport','Fuel','Utilities','Marketing','Software','Taxes and fees','Other'];
var NAV=[['overview','Overview'],['customers','Customers'],['invoices','Invoices'],['payments','Payments'],['expenses','Expenses'],['reports','Reports'],['settings','Settings']];
var NAVKEY={customer:'customers',invoice:'invoices'};

var S={customers:[],invoices:[],payments:[],expenses:[],settings:{businessName:BRAND.name,currency:'KES',taxRate:0,prefix:'INV-'},
  ready:{},view:'overview',param:null,q:'',ifilter:'all',year:new Date().getFullYear(),db:null,dl:null,err:null,noDb:false,c:null};

/* ---------- helpers ---------- */
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){return new Date(s+'T00:00:00')}
function fd(s){if(!s)return '';var d=pd(s);return isNaN(d)?esc(s):d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/86400000)}
function money(n){var c=S.settings.currency||'KES';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,currencyDisplay:'code',maximumFractionDigits:2}).format(+n||0)}catch(e){return c+' '+(+n||0).toFixed(2)}}
function compact(n){n=+n||0;if(n>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return (n/1e3).toFixed(1).replace('.0','')+'k';return String(Math.round(n))}
function niceMax(x){var m=Math.pow(10,Math.floor(Math.log10(x))),n=x/m;return (n<=1?1:n<=2?2:n<=5?5:10)*m}
function strip(o){var r={};for(var k in o){if(k!=='id'&&k!=='sample')r[k]=o[k]}return r}
function toast(msg,kind){var t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='bad'?' bad':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3600)}
function errMsg(e){var c=e&&e.code;if(c==='invalid_argument')return 'You do not have permission to change these records.';if(c==='quota_exceeded')return 'Storage is full. Delete some records and try again.';if(c==='resource_exhausted')return 'Too many changes at once. Wait a moment and try again.';return 'Could not save. Check your connection and try again.'}

/* ---------- data layer ---------- */
async function put(coll,id,data){
  if(!S.db){toast('Saving is not available in this view. Open the page in claude.ai while signed in.','bad');return null}
  try{var ref=id?S.db.collection(coll).doc(id):S.db.collection(coll).doc();await ref.set(data);return ref.id}
  catch(e){toast(errMsg(e),'bad');return null}
}
async function del(coll,id){
  if(!S.db)return false;
  try{await S.db.collection(coll).doc(id).delete();return true}catch(e){toast(errMsg(e),'bad');return false}
}
function compute(){
  var t=todayStr(),paid={},custPaid={},custInv={};
  S.payments.forEach(function(p){var a=+p.amount||0;if(p.invoiceId)paid[p.invoiceId]=round2((paid[p.invoiceId]||0)+a);custPaid[p.customerId]=round2((custPaid[p.customerId]||0)+a)});
  var byId={},cust={};S.customers.forEach(function(c){cust[c.id]=c});
  var inv=S.invoices.map(function(i){
    var sub=round2((i.items||[]).reduce(function(a,x){return a+(+x.qty||0)*(+x.price||0)},0));
    var tax=round2(sub*(+i.taxRate||0)/100),total=round2(sub+tax),p=paid[i.id]||0,bal=Math.max(round2(total-p),0);
    var st=(total>0&&bal<=0.004)?'paid':(i.dueDate&&i.dueDate<t?'overdue':(p>0?'partial':'unpaid'));
    var o=Object.assign({},i,{sub:sub,tax:tax,total:total,paid:p,bal:bal,st:st});byId[i.id]=o;custInv[i.customerId]=round2((custInv[i.customerId]||0)+total);return o});
  inv.sort(function(a,b){return String(b.issueDate).localeCompare(String(a.issueDate))||String(b.number).localeCompare(String(a.number))});
  S.c={today:t,inv:inv,byId:byId,cust:cust,custBal:function(id){return round2((custInv[id]||0)-(custPaid[id]||0))},custInvoiced:function(id){return custInv[id]||0},custPaid:function(id){return custPaid[id]||0}};
}

function csv(rows,cols){var q=function(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return '﻿'+[cols.map(function(c){return q(c[0])}).join(',')].concat(rows.map(function(r){return cols.map(function(c){return q(c[1](r))}).join(',')})).join('\r\n')}
async function saveFile(name,data){
  if(!S.dl){
    try{var bl=new Blob([data],{type:'text/csv'}),ur=URL.createObjectURL(bl),an=document.createElement('a');an.href=ur;an.download=name;document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(ur)},1000);toast('Saved '+name)}
    catch(e){toast('Could not save the file.','bad')}
    return}
  try{await S.dl.save({filename:name,data:data});toast('Saved '+name)}
  catch(e){if(e&&e.code==='declined')return;toast('Could not save the file.','bad')}
}
function exportData(kind,custId){

  if(kind==='invoices')return ['invoices-'+d+'.csv',csv(c.inv,[['Number',function(r){return r.number}],['Customer',function(r){return cname(r.customerId)}],['Issued',function(r){return r.issueDate}],['Due',function(r){return r.dueDate}],['Subtotal',function(r){return r.sub}],['Tax',function(r){return r.tax}],['Total',function(r){return r.total}],['Paid',function(r){return r.paid}],['Balance',function(r){return r.bal}],['Status',function(r){return r.st}]])];
  if(kind==='payments')return ['payments-'+d+'.csv',csv(S.payments.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))}),[['Date',function(r){return r.date}],['Customer',function(r){return cname(r.customerId)}],['Invoice',function(r){return r.invoiceId&&c.byId[r.invoiceId]?c.byId[r.invoiceId].number:'On account'}],['Method',function(r){return r.method}],['Reference',function(r){return r.reference}],['Amount',function(r){return r.amount}]])];
  if(kind==='expenses')return ['expenses-'+d+'.csv',csv(S.expenses.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))}),[['Date',function(r){return r.date}],['Vendor',function(r){return r.vendor}],['Category',function(r){return r.category}],['Amount',function(r){return r.amount}],['Notes',function(r){return r.notes}]])];
  if(kind==='statement'){

    return ['statement-'+(cu?cu.name:'customer').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+d+'.csv',csv(rows,[['Date',function(r){return r.date}],['Description',function(r){return r.desc}],['Charged',function(r){return r.debit}],['Paid',function(r){return r.credit}],['Balance',function(r){return r.bal}]])];
  }
}

function chart(months){
  var W=640,H=230,L=48,R=8,T=10,B=28,max=niceMax(Math.max(1,Math.max.apply(null,months.reduce(function(a,m){return a.concat([m.inc,m.exp])},[])))),ph=H-T-B,pw=W-L-R,band=pw/months.length,bw=Math.min(22,band/3.2),s='';
  for(var i=0;i<=4;i++){var v=max*i/4,y=T+ph-ph*i/4;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+compact(v)+'</text>'}
  months.forEach(function(m,idx){var cx=L+band*idx+band/2,h1=ph*m.inc/max,h2=ph*m.exp/max;
    s+='<rect class="in" x="'+(cx-bw-1)+'" y="'+(T+ph-h1)+'" width="'+bw+'" height="'+h1+'" rx="2"/><rect class="out" x="'+(cx+1)+'" y="'+(T+ph-h2)+'" width="'+bw+'" height="'+h2+'" rx="2"/><text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+esc(m.label)+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Collected and spent per month for the last six months">'+s+'</svg>';
}

var armed=null;
function arm(btn,label){
  if(armed&&armed.btn===btn){clearTimeout(armed.t);armed=null;return true}
  if(armed){clearTimeout(armed.t);armed.btn.textContent=armed.orig;armed.btn.classList.remove('armed')}
  var a={btn:btn,orig:btn.textContent};a.t=setTimeout(function(){btn.textContent=a.orig;btn.classList.remove('armed');if(armed===a)armed=null},4000);armed=a;
  btn.textContent=label||'Click again to confirm';btn.classList.add('armed');return false;
}

  var el=e.target.closest('[data-act],[data-go]');if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  if(el.dataset.go&&!el.dataset.act){go(el.dataset.go,el.dataset.id);return}
  var a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'close':closeDrawer();break;
    case 'new-customer':formCustomer();break;
    case 'edit-customer':formCustomer(id);break;
    case 'new-invoice':formInvoice(null,id);break;
    case 'edit-invoice':formInvoice(id);break;
    case 'new-payment':formPayment(id,el.dataset.inv);break;
    case 'new-expense':formExpense();break;
    case 'edit-expense':formExpense(id);break;
    case 'ifilter':S.ifilter=id;render();break;
    case 'add-item':{var p=$('.panel');addItem(p,{desc:'',qty:1,price:''});var ins=p.querySelectorAll('.item');ins[ins.length-1].querySelector('input').focus();break}
    case 'rm-item':{var p2=$('.panel');if(p2.querySelectorAll('.item').length>1){el.closest('.item').remove();recalc(p2)}break}
    case 'export':{var f=exportData(id);if(f)saveFile(f[0],f[1]);break}
    case 'statement':{var f2=exportData('statement',id);if(f2)saveFile(f2[0],f2[1]);break}
    case 'copy-invoice':{
      var i=S.c.byId[id],cu=S.c.cust[i.customerId];
      var txt=(S.settings.businessName||'')+'\nInvoice '+i.number+'\nBill to: '+(cu?cu.name:'')+'\nIssued: '+i.issueDate+'  Due: '+i.dueDate+'\n\n'+(i.items||[]).map(function(x){return x.desc+'  '+x.qty+' x '+money(x.price)}).join('\n')+'\n\nTotal: '+money(i.total)+'\nPaid: '+money(i.paid)+'\nBalance due: '+money(i.bal);
      try{await navigator.clipboard.writeText(txt);toast('Invoice summary copied')}catch(err){toast('Could not copy. Select the invoice text and copy it manually.','bad')}break}
    case 'del-payment':if(arm(el,'Click again to delete')){if(await del('payments',id))toast('Payment deleted')}break;
    case 'del-expense':if(arm(el,'Click again to delete')){if(await del('expenses',id))toast('Expense deleted')}break;
    case 'del-customer':if(arm(el,'Click again to delete')){if(await del('customers',id)){toast('Customer deleted');go('customers')}}break;
    case 'del-invoice':if(arm(el,'Click again to delete')){var ps=S.payments.filter(function(p){return p.invoiceId===id});for(var k=0;k<ps.length;k++)await del('payments',ps[k].id);if(await del('invoices',id)){toast('Invoice deleted');go('invoices')}}break;
    case 'clear-sample':if(arm(el,'Click again to clear')){var n=0;for(var c=0;c<COLLS.length;c++){var docs=S[COLLS[c]].filter(function(d){return d.sample});for(var j=0;j<docs.length;j++){if(await del(COLLS[c],docs[j].id))n++}}toast('Cleared '+n+' sample records')}break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderResults()}
  var p=e.target.closest('.panel');if(p&&$('#i_total',p))recalc(p);if(p&&$('#n_bal',p))calcBal(p);
});
document.addEventListener('change',function(e){if(e.target.id==='yr'){S.year=+e.target.value;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer()});
document.addEventListener('submit',async function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var kind=f.dataset.form,id=f.dataset.id||null,v=Object.fromEntries(new FormData(f).entries()),btn=$('button[type=submit]',f),ok;
  if(btn)btn.disabled=true;
  try{
    if(kind==='customer'){
      var base=id&&S.c.cust[id]?strip(S.c.cust[id]):{createdAt:new Date().toISOString()};
      var billed=round2(parseFloat(v.billed)||0),paid=round2(parseFloat(v.paid)||0),invNo=(v.invNo||'').trim();
      if(!id){var ne=$('#n_err',f);
        if(paid>0&&billed<=0){ne.textContent='Enter the amount billed before the amount paid.';return}
        if((v.service||'').trim()&&billed<=0){ne.textContent='Enter the amount billed for this service or product.';return}
        if(paid>billed){ne.textContent='Amount paid is more than the amount billed.';return}
        if(billed>0&&!invNo){ne.textContent='Enter an invoice number.';return}
        if(billed>0&&S.invoices.some(function(i){return i.number===invNo})){ne.textContent='Invoice '+invNo+' already exists. Use a different number.';return}}
      ok=await put('customers',id,Object.assign(base,{name:v.name.trim(),phone:v.phone.trim(),email:v.email.trim(),address:v.address.trim(),notes:v.notes.trim()}));
      if(ok&&!id&&billed>0){
        var td=v.invDate||S.c.today,svc=(v.service||'').trim(),iid=await put('invoices',null,{customerId:ok,number:invNo,issueDate:td,dueDate:addDays(td,14),items:[{desc:svc||'Invoice '+invNo,qty:1,price:billed}],taxRate:0,notes:'',createdAt:new Date().toISOString()});
        if(iid&&paid>0)await put('payments',null,{customerId:ok,invoiceId:iid,amount:paid,date:td,method:v.method,reference:'',createdAt:new Date().toISOString()});
      }
      if(ok){closeDrawer();toast(id?'Customer updated':'Customer added');if(!id)go('customer',ok)}
    }else if(kind==='invoice'){
      var items=readItems(f);if(!items.length){$('#i_err',f).textContent='Add at least one line with a description or price.';return}
      if(v.dueDate<v.issueDate){$('#i_err',f).textContent='The due date is before the issue date.';return}
      var b2=id&&S.c.byId[id]?strip(S.invoices.filter(function(x){return x.id===id})[0]):{createdAt:new Date().toISOString()};
      ok=await put('invoices',id,Object.assign(b2,{customerId:v.customerId,number:v.number.trim(),issueDate:v.issueDate,dueDate:v.dueDate,items:items,taxRate:parseFloat(v.taxRate)||0,notes:v.notes.trim()}));
      if(ok){closeDrawer();toast(id?'Invoice updated':'Invoice created');if(!id)go('invoice',ok)}
    }else if(kind==='payment'){
      var amt=round2(parseFloat(v.amount));if(!(amt>0))return;
      ok=await put('payments',null,{customerId:v.customerId,invoiceId:v.invoiceId||null,amount:amt,date:v.date,method:v.method,reference:v.reference.trim(),createdAt:new Date().toISOString()});
      if(ok){closeDrawer();toast('Payment recorded')}
    }else if(kind==='expense'){
      var b3=id?strip(S.expenses.filter(function(x){return x.id===id})[0]||{}):{createdAt:new Date().toISOString()};
      ok=await put('expenses',id,Object.assign(b3,{date:v.date,amount:round2(parseFloat(v.amount)),vendor:v.vendor.trim(),category:(v.category||'Other').trim(),notes:v.notes.trim()}));
      if(ok){closeDrawer();toast(id?'Expense updated':'Expense added')}
    }else if(kind==='settings'){
      ok=await put('settings','main',{businessName:BRAND.name,currency:v.currency,taxRate:parseFloat(v.taxRate)||0,prefix:v.prefix.trim()||'INV-'});
      if(ok)toast('Settings saved')
    }
  }finally{if(btn)btn.disabled=false}
});

/* Browser storage fallback with the same call shape as the shared database. */
function localDb(){
  var KEY='ledgerly-records-v1',mem=null,subs={};
  function load(){if(mem)return mem;try{var r=localStorage.getItem(KEY);mem=r?JSON.parse(r):{}}catch(e){mem={}}return mem}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}}
  function notify(c){(subs[c]||[]).forEach(function(f){f()})}
  function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function sub(c,f){(subs[c]=subs[c]||[]).push(f);setTimeout(f,0);return function(){}}
  return {
    collection:function(c){return {
      doc:function(id){id=id||uid();return {id:id,
        set:async function(data){var m=load();m[c]=m[c]||{};m[c][id]=JSON.parse(JSON.stringify(data));save();notify(c)},
        delete:async function(){var m=load();if(m[c]){delete m[c][id];save();notify(c)}}}},
      onSnapshot:function(next){return sub(c,function(){var d=load()[c]||{};next({docs:Object.keys(d).map(function(id){return {id:id,exists:true,data:function(){return d[id]}}})})})}
    }},
    doc:function(path){var p=path.split('/'),c=p[0],id=p[1];return {onSnapshot:function(next){return sub(c,function(){var d=(load()[c]||{})[id];next({exists:!!d,data:function(){return d}})})}}}
  };
}
render();
(async function(){
  var cl=window.claude;
  try{
    if(cl&&cl.use){
      var r=await Promise.all([cl.use('db'),cl.use('downloads'),cl.use('user')]);
      S.db=r[0];S.dl=r[1];var u=r[2];
      if(u&&S.db){try{var cw=await u.can('data.write');if(cw===false)document.body.classList.add('ro')}catch(e){}}
    }
  }catch(e){}
  if(!S.db){S.db=localDb();S.local=true}
  COLLS.forEach(function(k){
    S.db.collection(k).onSnapshot(function(snap){S[k]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready[k]=true;schedule()},function(){S.err=true;schedule()});
  });
  S.db.doc('settings/main').onSnapshot(function(snap){if(snap.exists)S.settings=Object.assign({currency:'KES',taxRate:0,prefix:'INV-'},snap.data(),{businessName:BRAND.name});schedule()},function(){});
})();
})();
